name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Build static files (if any)
        run: echo "No build step needed - static files served by FastAPI"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: false  # Set to true when you want GitHub Pages deployment
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend

  deploy-cloud-run:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    if: false  # Set to true when you have GCP setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}

      - name: Build and push Docker image
        run: |
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/skillbridge:${{ github.sha }} .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/skillbridge:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy skillbridge \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/skillbridge:${{ github.sha }} \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --port 8000

  deploy-railway:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    if: false  # Set to true when you have Railway setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy
        run: railway up --service skillbridge
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    if: false  # Set to true when you have Render setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger Render Deploy
        run: |
          curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}"
